apiVersion: apps/v1
kind: Deployment
metadata:
  name: rancher-mcp
  namespace: ai
  labels:
    app: rancher-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rancher-mcp
  template:
    metadata:
      labels:
        app: rancher-mcp
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rancher-mcp
          image: node:22-slim
          command: ["npx", "-y", "@futuretea/rancher-mcp-server@latest"]
          args:
            - --port=8080
            - --rancher-server-url=https://rancher.gpu.lab
            - --rancher-tls-insecure=true
            - --read-only=true
            - --disable-destructive=true
            - --show-sensitive-data=false
            - --toolsets=kubernetes,rancher
          env:
            - name: HOME
              value: /home/node
            - name: RANCHER_MCP_RANCHER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: rancher-mcp-token
                  key: token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: rancher-mcp
  namespace: ai
  labels:
    app: rancher-mcp
spec:
  selector:
    app: rancher-mcp
  ports:
    - name: http
      port: 8080
      targetPort: 8080
